<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Parchment & Ink Gradients -->
    <radialGradient id="parchmentBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf5" />
      <stop offset="65%" stop-color="#f4ecd8" />
      <stop offset="100%" stop-color="#ddc69d" />
    </radialGradient>
    
    <linearGradient id="neuralGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b1e1e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="synapsePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Shadow Filter -->
    <filter id="inkShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#1a0f0a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Aged Parchment Seal Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#parchmentBg)" stroke="#5a3825" stroke-width="1.8" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#8b1e1e" stroke-width="0.75" stroke-dasharray="2.5 1.5" opacity="0.6" />

  <!-- Brain Silhouette Group with Calligraphy Stroke & Neural Topology -->
  <g filter="url(#inkShadow)">
    <!-- LEFT CEREBRAL HEMISPHERE -->
    <!-- Outer Contour & Gyri Convolutions -->
    <path d="
      M 31 15
      C 27 15, 23 16, 20 18.5
      C 16.5 21.5, 14.5 25, 15 29
      C 13 31, 13 34, 14.5 36.5
      C 13.5 39, 14.5 42.5, 17 44.5
      C 19 46, 21.5 46.5, 24 46
      C 26 48, 28.5 48.5, 31 47.5
      L 31 15 Z"
      fill="#2b1b12"
      stroke="#1a0f0a"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Left Internal Synaptic Fissures (Parchment Gold Lines) -->
    <path d="M 20 22 C 23 24, 25 21, 28 22" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 16 30 C 19 29, 22 33, 27 30" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 16 36 C 20 37, 22 35, 25 38" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 21 44 C 23 41, 26 43, 29 40" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />

    <!-- RIGHT CEREBRAL HEMISPHERE -->
    <!-- Outer Contour & Gyri Convolutions -->
    <path d="
      M 33 15
      C 37 15, 41 16, 44 18.5
      C 47.5 21.5, 49.5 25, 49 29
      C 51 31, 51 34, 49.5 36.5
      C 50.5 39, 49.5 42.5, 47 44.5
      C 45 46, 42.5 46.5, 40 46
      C 38 48, 35.5 48.5, 33 47.5
      L 33 15 Z"
      fill="#2b1b12"
      stroke="#1a0f0a"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Right Internal Synaptic Fissures (Parchment Gold Lines) -->
    <path d="M 44 22 C 41 24, 39 21, 36 22" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 48 30 C 45 29, 42 33, 37 30" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 48 36 C 44 37, 42 35, 39 38" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 43 44 C 41 41, 38 43, 35 40" fill="none" stroke="#f4ecd8" stroke-width="1.2" stroke-linecap="round" />

    <!-- Central Longitudinal Fissure Divider -->
    <line x1="32" y1="15" x2="32" y2="47" stroke="#1a0f0a" stroke-width="1.4" stroke-linecap="round" />

    <!-- Glowing Synaptic Connection Nodes (Neural Energy Points) -->
    <!-- Central frontal pole -->
    <circle cx="32" cy="18" r="1.6" fill="#fef08a" stroke="#8b1e1e" stroke-width="0.8" />
    
    <!-- Left hemisphere synapses -->
    <circle cx="23" cy="27" r="1.3" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />
    <circle cx="26" cy="36" r="1.3" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />
    <circle cx="19" cy="40" r="1.1" fill="#fef08a" stroke="#8b1e1e" stroke-width="0.6" />

    <!-- Right hemisphere synapses -->
    <circle cx="41" cy="27" r="1.3" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />
    <circle cx="38" cy="36" r="1.3" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />
    <circle cx="45" cy="40" r="1.1" fill="#fef08a" stroke="#8b1e1e" stroke-width="0.6" />

    <!-- Stem / Cerebellum Base Node -->
    <circle cx="32" cy="45" r="1.4" fill="#fef08a" stroke="#8b1e1e" stroke-width="0.8" />
  </g>
</svg>